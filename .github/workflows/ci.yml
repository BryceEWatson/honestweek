name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer commit on a pull request cancels that pull request's run still in progress. Each push
# to main gets a group of its own, so none of those runs is cancelled or skipped.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      # Zero runtime dependencies: there is nothing to install.
      - name: Run the test suite
        run: node --test

  # honestweek is developed on Windows and used on macOS too, so the suite runs on both.
  # A separate job keeps the Linux job names above unchanged.
  test-other-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node-version: ['22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
      # An experiment for issue 143: Windows Defender scans the files the tests write and the git
      # and node processes they start. Leaving the checkout and the temp folders out of its scans
      # shows how much of the Windows job that costs. This changes a security setting, on
      # GitHub's throwaway runner only.
      - name: Leave the checkout and temp folders out of Defender's scans
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            Get-MpComputerStatus | Select-Object AMRunningMode, RealTimeProtectionEnabled | Format-List
            Add-MpPreference -ExclusionPath @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, (Get-Item $env:TEMP).FullName)
            (Get-MpPreference).ExclusionPath
          } catch {
            Write-Output "::warning::Defender's settings couldn't be read or changed: $_"
          }
      # Zero runtime dependencies: there is nothing to install.
      - name: Run the test suite
        run: node --test
