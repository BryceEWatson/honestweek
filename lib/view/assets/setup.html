<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup · honestweek</title>
<link rel="stylesheet" href="common.css">
</head>
<body data-page="setup">
<header class="topbar">
  <a class="brand" href="setup.html">honestweek</a>
  <nav aria-label="Pages"><a href="setup.html" aria-current="page">Setup</a></nav>
  <span class="topbar-gap"></span>
</header>
<p class="statusline" id="status" role="status" hidden></p>
<main id="content" class="setup">
  <h1>Set up honestweek</h1>
  <p class="lead" id="lead">Connecting.</p>
  <div id="form" hidden>
    <section class="setup-part" aria-labelledby="reposH">
      <h2 id="reposH">Repositories <span id="rolesHelp"></span></h2>
      <p class="fine" id="found"></p>
      <ul class="repolist" id="repos"></ul>
      <div class="setup-inline">
        <label class="sr" for="addPath">Add a folder</label>
        <input class="setup-input" id="addPath" type="text" autocomplete="off" spellcheck="false" placeholder="Add a folder: /path/to/your/repo">
        <button type="button" class="btn" id="addBtn">Add</button>
      </div>
    </section>
    <section class="setup-part" aria-labelledby="youH">
      <h2 id="youH">You</h2>
      <div class="setup-row">
        <label for="emails">Emails <span id="emailHelp"></span></label>
        <input id="emails" type="text" autocomplete="off" spellcheck="false">
        <p class="fine warnline" id="emailNote" hidden></p>
      </div>
      <div class="setup-row">
        <label for="timezone">Timezone</label>
        <input id="timezone" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="setup-row">
        <label for="histKind">How far back <span id="histHelp"></span></label>
        <div class="setup-inline">
          <select id="histKind">
            <option value="week">Last week</option>
            <option value="days">Last … days</option>
            <option value="from">From a date</option>
            <option value="range">Between dates</option>
            <option value="all">All history</option>
          </select>
          <input id="histDays" type="number" min="1" max="3660" value="30" autocomplete="off" aria-label="Days" hidden>
          <input id="histFrom" type="date" autocomplete="off" aria-label="From" hidden>
          <input id="histTo" type="date" autocomplete="off" aria-label="To" hidden>
        </div>
        <p class="fine" id="histLine" hidden></p>
        <p class="fine muted" id="logsLine"></p>
      </div>
    </section>
    <section class="setup-part" aria-labelledby="wordsH">
      <h2 id="wordsH">Private words <span id="wordsHelp"></span></h2>
      <div class="setup-row">
        <label for="names" id="namesLabel"></label>
        <input id="names" type="text" autocomplete="off" spellcheck="false">
      </div>
      <div class="setup-row">
        <label for="terms" id="termsLabel"></label>
        <input id="terms" type="text" autocomplete="off" spellcheck="false">
      </div>
    </section>
    <section class="setup-part" aria-labelledby="goalsH">
      <h2 id="goalsH"><label for="goals">Goal list</label> <span class="muted">(optional)</span> <span id="goalsHelp"></span></h2>
      <input class="setup-input" id="goals" type="text" autocomplete="off" spellcheck="false" placeholder="/path/to/your/goals.json">
    </section>
    <div class="setup-inline setup-actions">
      <button type="button" class="btn" id="previewBtn">Preview</button>
      <button type="button" class="btn primary" id="saveBtn" disabled>Save</button>
    </div>
    <p class="fine warnline" id="problem" role="alert" hidden></p>
    <div id="preview" hidden>
      <p class="fine" id="previewSummary"></p>
      <ul class="fine" id="previewNotes"></ul>
      <details class="help-wide"><summary>The file</summary><pre class="setup-pre" id="previewText" tabindex="0" aria-label="The config setup will write"></pre></details>
    </div>
  </div>
</main>
<footer class="quiet">
  <p class="quiet-line">Your answers stay on this machine.</p>
</footer>
<script src="key.js"></script>
<script src="private-text.js"></script>
<script src="form.js"></script>
<script src="setup.js"></script>
</body>
</html>
