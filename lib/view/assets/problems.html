<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problems · honestweek</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="problems.css">
</head>
<body data-page="problems">
<header class="topbar">
  <a class="brand" href="problems.html">honestweek</a>
  <nav aria-label="Pages"><a href="search.html">Find</a><a href="goal.html">Goals</a><a href="replay.html">Replay</a><a href="problems.html" aria-current="page">Problems<span class="navcount" id="navHigh" hidden></span></a><a href="settings.html">Settings</a></nav>
  <span class="topbar-gap"></span>
  <span class="window" id="window"></span>
  <span class="privacy" id="privacy"></span>
  <button type="button" class="keybtn" id="keyBtn" aria-expanded="false" aria-controls="evkeyPanel" aria-label="How each link is known" title="How each link is known">?</button>
  <div class="evkey-pop" id="evkeyPanel" role="region" aria-label="How each link is known" hidden><p class="evkey" data-evkey></p></div>
</header>
<div class="demo" id="demo" hidden></div>
<p class="statusline" id="status" role="status" hidden></p>
<main class="pwrap" id="content">
  <div class="phead">
    <div>
      <h1>Where it went wrong</h1>
      <p class="lead" id="lead"></p>
    </div>
  </div>
  <p class="sessfilter" id="sessFilter" hidden></p>
  <section class="ptable" aria-labelledby="browseH">
    <div class="ptable-head">
      <h2 id="browseH">Found <span class="hcount" id="foundCount"></span></h2>
      <details class="pfilter" id="filterBox"><summary>Filter</summary>
        <div class="chips pgroups" id="groups" role="group" aria-label="Show one group of patterns"></div>
        <div class="chips sfilter" id="statusFilter" role="group" aria-label="Show patterns by what your sessions show"></div>
      </details>
    </div>
    <p class="filternote" id="trendNote" role="status" hidden></p>
    <p class="filternote" id="filterNote" hidden></p>
    <div id="cards"></div>
  </section>
  <section class="pins" id="insights" aria-label="/insights" hidden></section>
  <details class="pfacts facts" id="facts" hidden></details>
  <details class="prirule" id="priRule"></details>
  <details class="pchecks" id="checksBox"><summary><h2 id="checksH" class="sh">How the checks work</h2></summary><div id="checks"></div></details>
  <details class="pfoot" id="foot"></details>
</main>
<footer class="quiet" id="quiet">
  <p class="quiet-line"><span id="privnote"></span> <span>Read from logs on this machine. Nothing leaves it.</span></p>
</footer>
<p class="sr" id="announce" aria-live="polite"></p>
<script src="evidence.js"></script>
<script src="key.js"></script>
<script src="private-text.js"></script>
<script src="common.js"></script>
<script src="prefs.js"></script>
<script src="insights.js"></script>
<script src="facts.js"></script>
<script src="problems.js"></script>
</body>
</html>
